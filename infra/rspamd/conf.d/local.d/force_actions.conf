rules {
  USER_NETFLIX_DEVICE_NOTICE {
    action = "discard";
    expression = "USER_SMTP_NETFLIX_DEVICE_FROM & USER_SMTP_NETFLIX_DEVICE_SUBJECT & USER_SMTP_NETFLIX_DEVICE_TO & RCPT_COUNT_ONE & TO_MATCH_ENVRCPT_ALL & DMARC_POLICY_ALLOW & R_DKIM_ALLOW";
    message = "Notification répétée écartée à la demande du destinataire";
  }
}
