extended_spam_headers = true;

# rspamd saute ses routines milter pour les connexions locales ou
# authentifiées. SentiMail V3 a besoin d'une preuve uniforme quelle que soit
# l'origine SMTP : ces trois en-têtes sont l'exception explicite.
skip_local = true;
skip_authenticated = true;
local_headers = ["x-spam-status", "x-spamd-result", "authentication-results"];
authenticated_headers = ["x-spam-status", "x-spamd-result", "authentication-results"];

# X-Spamd-Result porte le score structuré lu par le hook rspamd de V3 ;
# Authentication-Results porte SPF/DKIM/DMARC lu par le hook authentication.
use = ["x-spam-status", "x-spamd-result", "authentication-results"];

routines {
    "authentication-results" {
        # POINT CRITIQUE. Le hook d'authentification de SentiMail V3
        # (collector/src/sentimail_v3/dossier/hooks/authentication.py) ne fait
        # confiance qu'à un Authentication-Results dont l'authserv-id vaut
        # exactement « rspamd.sentimail ». Toute autre valeur — y compris le
        # nom d'hôte du conteneur — rend l'en-tête invisible pour l'analyse,
        # et le message est traité comme non authentifié.
        #
        # Postfix passe déjà « rspamd.sentimail » via milter_macro_daemon_name.
        # La valeur est répétée ici pour que la preuve reste correcte même si
        # le message n'arrive pas par ce MX (réinjection, non_smtpd_milters).
        authserv_id = "rspamd.sentimail";
        header = "Authentication-Results";
        remove = 0;
    }
}
