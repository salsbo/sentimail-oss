# Seuils globaux de rspamd.
#
# rspamd est ici un producteur de preuve, pas l'autorité de livraison : c'est
# le pipeline de SentiMail V3 qui décide, journalise et laisse la main à un
# humain. Un rejet SMTP au milter court-circuiterait tout cela et rendrait la
# décision invisible dans la console.
#
# Les seuils sont donc placés hors d'atteinte : rspamd score, il ne tranche pas.
reject = 100;
add_header = 6;
greylist = 100;
