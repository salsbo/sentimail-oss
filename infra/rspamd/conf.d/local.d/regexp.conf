# Préférence SMTP demandée le 24 octobre 2026. Ces critères ne qualifient pas
# la sécurité du courrier et ne modifient aucun verdict SentiMail.
USER_SMTP_NETFLIX_DEVICE_FROM {
  re = 'From=/^(?:Netflix\s*<)?info@account\.netflix\.com>?$/iH';
  score = 0.0;
  description = "Expéditeur exact de la notification Netflix";
}

USER_SMTP_NETFLIX_DEVICE_SUBJECT {
  re = 'Subject=/^A new device is using your account$/H';
  score = 0.0;
  description = "Objet exact de la notification répétée";
}

USER_SMTP_NETFLIX_DEVICE_TO {
  # Le compteur RCPT_COUNT_ONE de rspamd compte les destinataires de l'en-tête,
  # pas ceux de l'enveloppe : exclure explicitement toute autre adresse SMTP.
  re = 'To=/^amartin@example\.org$/iH & check_smtp_data("rcpt", /^amartin@example\.org$/i) & !check_smtp_data("rcpt", /^(?!amartin@example\.org$).+$/i)';
  score = 0.0;
  description = "Boîte ayant demandé ce filtre";
}
